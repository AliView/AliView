name: Build macOS DMG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-dmg:
    strategy:
      matrix:
        include:
          - os: macos-13      # Intel (x86_64)
            arch: x64
          - os: macos-14      # Apple Silicon (arm64)
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Guard against a matrix misconfiguration silently producing two builds of
      # the same architecture (setup-java and jpackage build native to the
      # runner, so the runner's arch IS the artifact's arch).
      - name: Verify runner architecture
        run: |
          ACTUAL=$(uname -m)   # x86_64 on Intel, arm64 on Apple Silicon
          case "${{ matrix.arch }}" in
            x64)   EXPECT=x86_64 ;;
            arm64) EXPECT=arm64  ;;
            *)     echo "::error::Unknown matrix.arch '${{ matrix.arch }}'"; exit 1 ;;
          esac
          echo "matrix.arch=${{ matrix.arch }} expects $EXPECT; runner reports $ACTUAL"
          if [ "$ACTUAL" != "$EXPECT" ]; then
            echo "::error::Runner architecture $ACTUAL does not match expected $EXPECT for ${{ matrix.arch }}."
            exit 1
          fi

      - name: Build DMG via jpackage
        run: |
          echo "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}"
          chmod +x jpackage/jpackage-mac.sh
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("pom.xml")
          root = tree.getroot()
          ns = {"m": root.tag.split("}")[0].strip("{")}
          print(root.find("m:version", ns).text)
          PY
          )
          PATCH=${GITHUB_RUN_NUMBER}
          JPACKAGE_TYPES=dmg APP_VERSION="${VERSION}.${PATCH}" ./jpackage/jpackage-mac.sh
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("pom.xml")
          root = tree.getroot()
          ns = {"m": root.tag.split("}")[0].strip("{")}
          print(root.find("m:version", ns).text)
          PY
          )
          DMG=$(ls target/jpackage-mac/*.dmg | head -n 1)
          mv "$DMG" "target/jpackage-mac/AliView-${VERSION}-macOS-${{ matrix.arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliView-${{ matrix.arch }}-DMG
          path: target/jpackage-mac/AliView-*-macOS-${{ matrix.arch }}.dmg
