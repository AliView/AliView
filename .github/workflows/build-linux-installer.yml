name: Build Linux Installer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # needed to attach the installer to a GitHub Release on tags

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Temurin (not the distro JDK) is what gives the bundle a low glibc floor.
      # Nothing native is compiled here — jlink copies the runtime .so files and
      # jpackage copies a prebuilt launcher, so the floor is inherited from this
      # JDK. The build OS (ubuntu-latest) is irrelevant to compatibility.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install makeself
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself

      - name: Build app-image and self-extracting installer
        run: |
          echo "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}"
          BASE=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("pom.xml")
          root = tree.getroot()
          ns = {"m": root.tag.split("}")[0].strip("{")}
          print(root.find("m:version", ns).text)
          PY
          )
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          # Full version (with run number) is the internal build/app version;
          # the plain pom version is used for the artifact filename, matching
          # the macOS and Windows workflows.
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BASE}" >> "$GITHUB_ENV"
          # jpackage-linux.sh builds the app-image only (no .deb).
          APP_VERSION="${VERSION}" ./jpackage/jpackage-linux.sh
          APP_VERSION="${VERSION}" ./linux-app-image-installer/create-package.sh

      # Hard regression gate: the whole point of using Temurin is a low glibc
      # floor. Temurin x64 targets ~glibc 2.17; fail loudly if a toolchain
      # change ever pushes the bundle above what our oldest target distro
      # (Ubuntu 20.04 / Debian 11 = glibc 2.31) can run.
      - name: Enforce glibc floor
        run: |
          MAX_GLIBC="2.31"
          IMG="target/jpackage-linux/AliView"
          FLOOR=$(objdump -T "$IMG/bin/AliView" "$IMG/lib/runtime/lib/server/libjvm.so" 2>/dev/null \
            | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "Measured glibc floor: ${FLOOR:-unknown} (ceiling: ${MAX_GLIBC})"
          if [ -z "$FLOOR" ]; then
            echo "::error::Could not determine glibc floor from the app-image."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$FLOOR" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::glibc floor ${FLOOR} exceeds ceiling ${MAX_GLIBC} — bundle would not run on older distros. Check the JDK (use Temurin, not a distro JDK)."
            exit 1
          fi

      - name: Rename installer
        run: |
          mv linux-app-image-installer/aliview.install.run \
             "linux-app-image-installer/AliView-${RELEASE_VERSION}-linux-x86_64.run"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliView-linux-installer
          path: linux-app-image-installer/AliView-*-linux-x86_64.run

      - name: Attach installer to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: linux-app-image-installer/AliView-*-linux-x86_64.run
